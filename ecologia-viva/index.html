function simPred(p,id){let prey=p.prey,pred=p.pred,preys=[prey],preds=[pred];
 const years=30,steps=12*years;
 for(let j=1;j<=steps;j++){
  const dt=1/12,t=j*dt,season=id==='pantanal'?1+p.clima/100*.25*Math.sin(t*2*Math.PI):1;

 }
 return {x:Array.from({length:years+1},(_,i)=>i),series:[{name:id==='elton'?'Lebres':'Capivaras',color:styles.prey,y:preys},{name:id==='elton'?'Linces':'Onças',color:styles.pred,y:preds}],unit:'Índices de abundância hipotéticos',xLabel:'Anos simulados',conclusion:preys.at(-1)===0?'Presa desapareceu no cenário: teste condições de menor pressão.':'Oscilação, estabilidade e redução dependem conjuntamente das taxas e dos recursos.',metrics:[['Presa no fim',preys.at(-1),'índice'],['Predador no fim',preds.at(-1),'índice'],['Predador máximo',Math.max(...preds),'índice']]};

function simCaatinga(p){let soil=25,seed=p.semente,water=[],recr=[],total=0;for(let m=0;m<36;m++){

 }

function simAmazonia(p){let h=[],r=[];for(let m=0;m<48;m++){

 return {x:Array.from({length:48},(_,i)=>i+1),series:[{name:'Habitat acessível',color:styles.prey,y:h},{name:'Recrutamento posterior',color:styles.pred,y:lagged}],unit:'Índices 0–100 (%)',xLabel:'Mês simulado',conclusion:'Há uma defasagem ilustrativa entre a cheia e o recrutamento de juvenis. Não é previsão de um estoque pesqueiro.',metrics:[['Acesso máximo',Math.max(...h),'índice %'],['Recrutamento médio',avg(lagged),'índice %']]};

 const metrics=document.getElementById('br-metrics');if(metrics)metrics.innerHTML=dat.metrics.map(([name,value,unit])=>`<div><strong>${f(value,2)}</strong><small>${e(name)} · ${e(unit)}</small></div>`).join('');
 const note=document.getElementById('br-note');if(note)note.textContent=dat.conclusion;const saved=document.getElementById('br-saved');if(saved)saved.textContent=prior?'Referência guardada: a curva cinza pontilhada representa a primeira variável de resposta do cenário guardado.':'Fixe uma curva de referência e altere uma variável para testar outra hipótese.';
 c.params.forEach(([key])=>{const out=document.getElementById('br-val-'+key);if(out)out.textContent=f(p[key],3)+' '+c.params.find(y=>y[0]===key)[2]})}

function clickHandler(ev){const el=ev.target.closest('button');if(!el||!el.closest('.br-wrap'))return;

 if(el.dataset.brBaseline){BR.base[BR.id]=JSON.parse(JSON.stringify(compute(BR.id,BR.params[BR.id])));refresh();return}
 if(el.dataset.brPlay){play();return}
 if(el.dataset.brPause){stop();return}
}
function inputHandler(ev){const el=ev.target;if(!el.closest('.br-wrap'))return;

 if(el.dataset.brTime){BR.step=+el.value;stop();refresh()}
}
