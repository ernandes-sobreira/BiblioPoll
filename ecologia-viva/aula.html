function renderBio3D(){
 const variant=BIO_FACTS[S.bioKind]?S.bioKind:'dna',f=BIO_FACTS[variant];
 const steps=[['dna','DNA','Informação'],['rna','RNA','Transcrição'],['protein','Proteína','Tradução']].map(([k,l,d])=>`<button type="button" data-bio="${k}" class="bio3d-step ${variant===k?'selected':''}" aria-pressed="${variant===k}"><b>${l}</b><small>${d}</small></button>`).join('');
 return `<section class="bio3d-lab" aria-label="Laboratório interativo DNA RNA e proteínas">

 <div class="bio3d-grid">
 <div class="bio3d-model">

 <div class="bio3d-process" role="group" aria-label="Fluxo da expressão gênica"><button type="button" data-bio="dna" ${variant==='dna'?'class="selected"':''}>DNA</button><span class="process-arrow">→ transcrição →</span><button type="button" data-bio="rna" ${variant==='rna'?'class="selected"':''}>RNA</button><span class="process-arrow">→ tradução →</span><button type="button" data-bio="protein" ${variant==='protein'?'class="selected"':''}>Proteína</button><button type="button" class="btn small" data-action="bio-next">Próximo processo →</button></div>

 </section>`;
}
function updateBio3D(){
 const k=BIO_FACTS[S.bioKind]?S.bioKind:'dna',f=BIO_FACTS[k];
 document.querySelectorAll('[data-bio]').forEach(b=>{const selected=b.dataset.bio===k;b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected));});
 const im=document.getElementById('bio3d-image');if(im){im.src=BIO_IMAGES[k];im.alt='Arte original: '+f.name}
 const facts=document.getElementById('bio3d-facts');if(facts)facts.innerHTML=`<b>${f.name}</b><p>${f.description}</p>`;
 const tip=document.getElementById('bio3d-tip');if(tip)tip.innerHTML=`<b>Para discutir</b><p>${f.tip}</p>`;
 const legend=document.getElementById('bio3d-legend');if(legend)legend.textContent=f.legend;
 const canvas=document.getElementById('bio3d-canvas');if(canvas)canvas.setAttribute('aria-label','Estrutura espacial interativa de '+f.name);
 BIO_VIEWER?.setVariant(k);
}
function initBio3D(){const c=document.querySelector('[data-bio-canvas]');if(c)BIO_VIEWER=createBio3DViewer(c,S.bioKind)}
function disposeBio3D(){if(BIO_VIEWER){BIO_VIEWER.destroy();BIO_VIEWER=null}}
function createBio3DViewer(canvas,initial){
 const ctx=canvas.getContext('2d');
 if(!ctx)return {setVariant(){},reset(){},toggleSpin(){return false},zoom(){},destroy(){}};
 const clamp=(v,lo,hi)=>Math.min(hi,Math.max(lo,v));
 const PI=Math.PI,TAU=2*PI;
 let variant=initial, yaw=.55,pitch=.12,zoom=1,auto=!window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches;
 let W=500,H=320,U=68,paintTime=0,lastTime=0,raf=0,drag=false,lastX=0,lastY=0,disposed=false;
 let zoomGesture=null;
 const color={A:'#e5a568',T:'#84a9de',U:'#eb8774',C:'#62af94',G:'#c9aa72'};
 function rotate([x,y,z]){const ca=Math.cos(yaw),sa=Math.sin(yaw),cb=Math.cos(pitch),sb=Math.sin(pitch);const nx=ca*x-sa*z, nz=sa*x+ca*z;return [nx,cb*y-sb*nz,sb*y+cb*nz]}
 function project(p){const [x,y,z]=rotate(p);const k=6.5/(6.5-z);return {x:W/2+x*U*k,y:H/2-y*U*k,z,k}}
 function resize(){const dpr=clamp(window.devicePixelRatio||1,1,1.6);W=Math.max(180,canvas.clientWidth||500);H=Math.max(190,canvas.clientHeight||300);const w=Math.round(W*dpr),h=Math.round(H*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}ctx.setTransform(dpr,0,0,dpr,0,0);U=Math.min(W/4.9,H/4.9)*zoom}
 function sphere(p,r,c){const q=project(p),radius=Math.max(2,r*U*q.k);const grd=ctx.createRadialGradient(q.x-radius*.37,q.y-radius*.42,radius*.04,q.x,q.y,radius);grd.addColorStop(0,'#ffffff');grd.addColorStop(.20,c);grd.addColorStop(.88,c);grd.addColorStop(1,'#31534a');ctx.beginPath();ctx.arc(q.x,q.y,radius,0,TAU);ctx.fillStyle=grd;ctx.fill();ctx.lineWidth=.65;ctx.strokeStyle='rgba(21,52,40,.13)';ctx.stroke()}
 function bar(a,b,width,c){const p=project(a),q=project(b);const t=width*U*(p.k+q.k)*.5;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.lineCap='round';ctx.strokeStyle='rgba(10,64,56,.19)';ctx.lineWidth=t+1;ctx.stroke();ctx.strokeStyle=c;ctx.lineWidth=t;ctx.stroke();ctx.strokeStyle='rgba(255,255,255,.29)';ctx.lineWidth=Math.max(1,t*.20);ctx.stroke()}
 function background(){const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#f4faf6');g.addColorStop(1,'#e4f1eb');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(104,153,132,.07)';ctx.lineWidth=1;for(let i=1;i<6;i++){ctx.beginPath();ctx.moveTo(0,i*H/6);ctx.lineTo(W,i*H/6);ctx.stroke()}}
 function dnaObjects(){let objects=[];const N=50,turns=2.45,rad=.78;const strand=(i,shift)=>{const u=i/N;const th=turns*TAU*u+shift;return [rad*Math.cos(th),-1.70+3.4*u,rad*Math.sin(th)]};
 for(let i=0;i<N;i++){for(let side=0;side<2;side++){let a=strand(i,side*PI),b=strand(i+1,side*PI);objects.push({z:(rotate(a)[2]+rotate(b)[2])/2,draw:()=>bar(a,b,.125,side?'#3f79ac':'#209b88')})}}
 const sequence=['A','C','T','G','G','A','C','A','T','T','G','C','A','G','C','T','A','G','G','C'];
 for(let i=0;i<sequence.length;i++){const t=(i+.5)/sequence.length,at=50*t,a=strand(at,0),b=strand(at,PI),m=a.map((v,j)=>(v+b[j])/2);const pair={A:'T',T:'A',C:'G',G:'C'}[sequence[i]];
 const p1=a.map((v,j)=>v*.58+m[j]*.42),p2=b.map((v,j)=>v*.58+m[j]*.42);
 objects.push({z:rotate(m)[2],draw:()=>bar(a,b,.055,'#b5cfc6')});
 objects.push({z:rotate(p1)[2],draw:()=>sphere(p1,.105,color[sequence[i]])});objects.push({z:rotate(p2)[2],draw:()=>sphere(p2,.105,color[pair])})
 }
 return objects}
 function rnaObjects(){let objects=[];const N=55,turns=2.8,seq=['A','U','G','C','U','A','G','G','U','C','A','U','C','G','A','U','G','C','A','U','G','A','C'];
 const strand=i=>{let u=i/N,angle=u*turns*TAU;return [Math.cos(angle)*.70+Math.sin(u*PI*2)*.14,-1.7+u*3.4,Math.sin(angle)*.70]};
 for(let i=0;i<N;i++){let a=strand(i),b=strand(i+1);objects.push({z:(rotate(a)[2]+rotate(b)[2])/2,draw:()=>bar(a,b,.132,'#329d96')})}
 for(let i=0;i<seq.length;i++){let t=(i+.5)/seq.length,p=strand(t*N),theta=t*turns*TAU;let q=[p[0]+.27*Math.cos(theta),p[1],p[2]+.27*Math.sin(theta)];objects.push({z:rotate(q)[2],draw:()=>{bar(p,q,.065,'#9dbfba');sphere(q,.16,color[seq[i]])}})}return objects}
 function proteinObjects(){let objects=[];let points=[];
 const add=(p,c,w=.16)=>{points.push({p,c,w})};
 // Cadeia única com duas alfa-hélices e uma folha beta central, em arranjo didático.
 for(let i=0;i<=32;i++){let u=i/32,ang=u*4.5*PI;add([-.82+.23*Math.cos(ang),-1.32+2.35*u,-.20+.23*Math.sin(ang)],'#26a89b',.21)}
 for(let i=1;i<=9;i++){let t=i/9;add([-.79+.52*t,1.03+.17*Math.sin(t*PI),-.15-.15*t],'#72aac4',.14)}
 for(let i=1;i<=19;i++){let u=i/19;add([-.26+Math.sin(i*PI)*.03,1.03-2.0*u,-.28+Math.sin(i*.8)*.08],'#d4a443',.19)}
 for(let i=1;i<=8;i++){let u=i/8;add([-.25+.55*u,-.97-.15*Math.sin(u*PI),-.29],'#6a9abd',.13)}
 for(let i=1;i<=19;i++){let u=i/19;add([.30+Math.sin(i*PI)*.025,-.97+2.0*u,-.26+Math.sin(i*.8)*.05],'#e0b954',.19)}
 for(let i=1;i<=10;i++){let u=i/10;add([.30+.55*u,1.03+.18*Math.sin(u*PI),-.26+.2*u],'#6a9abd',.13)}
 for(let i=1;i<=32;i++){let u=i/32,ang=(1-u)*4.1*PI;add([.84+.25*Math.cos(ang),1.03-2.31*u,-.05+.25*Math.sin(ang)],'#84b749',.20)}
 for(let i=0;i<points.length-1;i++){const a=points[i],b=points[i+1];objects.push({z:(rotate(a.p)[2]+rotate(b.p)[2])/2,draw:()=>bar(a.p,b.p,(a.w+b.w)*.5,b.c)})}
 for(let i=0;i<points.length;i+=4){const pt=points[i];objects.push({z:rotate(pt.p)[2],draw:()=>sphere(pt.p,.09,pt.c)})}
 return objects}
 function paint(){if(disposed)return;resize();ctx.clearRect(0,0,W,H);background();let objects=variant==='dna'?dnaObjects():variant==='rna'?rnaObjects():proteinObjects();objects.sort((a,b)=>a.z-b.z);for(const o of objects)o.draw()}
 function frame(t){if(disposed)return;const dt=lastTime?Math.min(80,t-lastTime):0;lastTime=t;if(auto&&!document.hidden){yaw+=dt*.00024;if(t-paintTime>(window.innerWidth<700?52:40)){const r=canvas.getBoundingClientRect();if(r.bottom>0&&r.top<window.innerHeight)paint();paintTime=t}}raf=requestAnimationFrame(frame)}

 function key(e){if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home'].includes(e.key))return;e.preventDefault();auto=false;btn();if(e.key==='Home'){yaw=.55;pitch=.12;zoom=1}else if(e.key==='ArrowLeft')yaw-=.18;else if(e.key==='ArrowRight')yaw+=.18;else if(e.key==='ArrowUp')pitch=clamp(pitch-.14,-1.5,1.5);else pitch=clamp(pitch+.14,-1.5,1.5);paint()}

}

  refImg.src=variant==='human'?MICRO_HUMAN_REFERENCE:MICRO_IMAGES.organisms;

  refImg.alt=variant==='human'?'Ser humano com somente o coração interno visível no tórax':'Bactéria, planta e animal multicelular ilustrados';

 function drawHuman(){

  oval([.66,-.87,.10],.139,.185,'#e4baa4');

   [-.43,.64,0],[-.54,.49,0],[-.48,.08,0],[-.40,-.37,0],

return `${title('Capítulos do livro · abrir e aprofundar',g==='fundamentos'?'Da matéria à organização da vida.':'Explorar conceitos','A trilha é visual e breve na aula. Abra cada subcapítulo para estudar com mais tempo depois.')}<div class="grid two">${ch.map(c=>`<button class="chapter" data-topic="${c.id}"><span class="tag ${c.prioridade==='Essencial'?'live':''}">${c.prioridade==='Essencial'?'Aula':'Aprofundar'}</span><b>${esc(c.titulo)}</b><small>${esc(c.objetivo)}</small></button>`).join('')}</div><div class="actions"><button class="btn primary" data-view="trilha">Voltar ao zoom da vida →</button></div>`}
function renderLibrary(){let list=CHAPTERS.filter(c=>[c.titulo,c.aba,c.conceitos].join(' ').toLocaleLowerCase('pt-BR').includes(S.filter.toLocaleLowerCase('pt-BR')));return `${title('Biblioteca interativa','37 subcapítulos. Uma trajetória.','Explore todas as partes do livro, inclusive o material que não caberá no encontro presencial.')}<div class="panel"><label class="small" for="searchchap" style="font-weight:750">Buscar por conceito ou capítulo</label><input id="searchchap" type="text" placeholder="Ex.: DNA, população, Shannon, fungos, GBIF" value="${esc(S.filter)}" style="margin-top:7px" autocomplete="off"><div class="micro" style="margin-top:7px"><span id="countchap">${list.length}</span> capítulos encontrados</div></div><div class="library-list" id="library-list">${list.map(c=>chapterCard(c)).join('')}</div>`}
function chapterCard(c){return `<button class="chapter" data-topic="${c.id}" data-chapter-title="${esc(c.titulo+' '+c.aba+' '+c.conceitos).toLocaleLowerCase('pt-BR')}"><span class="tag ${c.prioridade==='Essencial'?'live':''}">${esc(c.aba)} · ${c.prioridade==='Essencial'?'Na aula':'Pós-aula'}</span><b>${esc(c.titulo)}</b><small>${esc(c.objetivo)}</small></button>`}
function renderLife(){const t=TAXA[S.taxonomy];return `${title('Diversidade da vida','Não existe um único tipo de indivíduo.','Do metabolismo microbiano às grandes linhagens animais. Clique nos grupos e descubra suas funções ecológicas.')}<div class="stage-layout"><div class="panel">${renderMicro3D('tree')}<div class="grid two" style="margin-top:13px">${TAXA.map(([ic,name],i)=>`<button class="taxon-btn ${S.taxonomy===i?'selected':''}" data-taxon="${i}"><span>${ic}</span><small>${esc(name)}</small></button>`).join('')}</div></div><div class="panel stage-info"><span class="stage-no">ORGANISMOS · FUNÇÕES ECOLÓGICAS</span><h2>${t[1]}</h2><p class="desc">${t[2]}</p><div class="key">A diversidade filogenética importa porque as linhagens apresentam diferentes formas de obter recursos, crescer e interagir.</div><div class="question"><b>Pergunta:</b><p>Como este grupo participa do funcionamento de um ecossistema?</p></div><div class="actions"><button class="btn" data-topic="c09">Ver árvore da vida</button><button class="btn primary" data-view="individuo">Ir ao indivíduo →</button></div></div></div><div class="notice warn" style="margin-top:14px">Bacteria, Archaea e Eukarya são três domínios tradicionalmente usados no ensino; a filogenia profunda permanece tema de pesquisa. Plantas, fungos e animais pertencem a Eukarya. “Protistas” e “peixes” são categorias úteis em aula, mas não clados exclusivos em todas as classificações.</div>`}
function renderIndividual(){return `${title('Nível ecológico 01','Um indivíduo nunca está isolado do ambiente.','Observe uma capivara: como características, fisiologia e comportamento interagem com o ambiente?')}<div class="stage-layout"><div class="panel">${image('individuo','Capivara individual no Pantanal em ambiente de áreas alagadas')}<p class="caption">Imagem original · indivíduo focal. Não representa dados sobre tolerância ou preferência de habitat.</p><div class="grid two" style="margin-top:12px">${[['Habitat','Onde vive, na escala considerada.'],['Nicho','Condições, recursos e interações que delimitam sua existência.'],['Fenótipo','Atributos observáveis resultantes de genótipo, ambiente e desenvolvimento.'],['Plasticidade','Mudança fenotípica em resposta ao ambiente, com limites biológicos.']].map(([a,b])=>`<div class="feature"><span class="ico">✳</span><div><strong>${a}</strong><p>${b}</p></div></div>`).join('')}</div></div><div class="panel stage-info"><div class="eyebrow">A pergunta de investigação</div><h2>O que condiciona sua sobrevivência?</h2><p class="desc">Considere alimento, água, temperatura, predadores e condições do micro-habitat. Cada resposta demanda observações ou experimentos apropriados.</p><div class="question"><b>Desafio para o grupo</b><p>O mesmo indivíduo teria a mesma atividade e utilização do habitat em uma seca extrema?</p></div><div class="notice" style="margin-top:15px">Não confunda <b>adaptação evolutiva</b> com <b>resposta fisiológica</b> ou <b>plasticidade individual</b>.</div><div class="actions"><button class="btn" data-topic="c17">Nicho e habitat</button><button class="btn primary" data-view="populacao">Vários indivíduos →</button></div></div></div>`}
function simulatePop(){const {n,k,b,d,i,e}=S.pop;let arr=[n];for(let step=0;step<30;step++){let x=arr[arr.length-1];let next=Math.max(0,Math.min(2000,x+(b-d)*x*(1-x/Math.max(1,k))+i-e));arr.push(next)}return arr}
function lineGraph(arr,K){const w=700,h=310,plot={x:54,y:20,width:615,height:242};const max=Math.max(K*1.13,1,...arr)*1.1;const X=i=>plot.x+i*plot.width/(arr.length-1);const Y=n=>plot.y+plot.height-n*plot.height/max;const path=arr.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(2)} ${Y(v).toFixed(2)}`).join(' ');const kY=Y(K).toFixed(2);return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Gráfico simulado do número de indivíduos por etapa"><rect width="700" height="310" fill="white"/>${[0,1,2,3,4].map(j=>`<line x1="${plot.x}" y1="${plot.y+j*plot.height/4}" x2="${plot.x+plot.width}" y2="${plot.y+j*plot.height/4}" stroke="#e6eee7"/>${textSvg(plot.x-10,plot.y+j*plot.height/4+4,Math.round(max*(1-j/4)),12,'#719185','end')}`).join('')}<line x1="${plot.x}" x2="${plot.x+plot.width}" y1="${kY}" y2="${kY}" stroke="#daa675" stroke-dasharray="7 6" stroke-width="2"/><path d="${path}" stroke="#2b8571" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(arr.length-1)}" cy="${Y(arr[arr.length-1])}" r="6" fill="#2b8571"/>${textSvg(350,298,'Etapas discretas simuladas (tempo abstrato)',13,'#779080')}${textSvg(606,Number(kY)-8,'K (hipótese)',12,'#bc8c58')}${[0,10,20,30].map(j=>textSvg(X(j),plot.y+plot.height+18,String(j),12,'#719185')).join('')}</svg>`}
function updatePop(){if(S.view!=='populacao')return;const a=simulatePop();const chart=$('#popchart');if(chart)chart.innerHTML=lineGraph(a,S.pop.k);$('#popnfinal').textContent=Math.round(a[a.length-1]).toLocaleString('pt-BR');$('#popdelta').textContent=(Math.round(a[a.length-1]-a[0])>=0?'+':'')+Math.round(a[a.length-1]-a[0]);$('#popr').textContent=(S.pop.b-S.pop.d).toFixed(2).replace('.',',');Object.entries(S.pop).forEach(([k,v])=>{const out=$('#pop-'+k+'-val');if(out)out.textContent=['b','d'].includes(k)?v.toFixed(2).replace('.',','):v})}
function renderPopulation(){let params=[['n','População inicial (N₀)',10,240,10],['k','Capacidade de suporte hipotética K',80,600,10],['b','Natalidade potencial/indivíduo/etapa',0,.6,.02],['d','Mortalidade potencial/indivíduo/etapa',0,.5,.02],['i','Imigração (indivíduos/etapa)',0,25,1],['e','Emigração (indivíduos/etapa)',0,25,1]];return `${title('Nível ecológico 02','A população é uma dinâmica.','Mude as condições de um modelo hipotético de capivaras e compare trajetórias. Uma curva não é um dado de campo.')}<div class="grid two" style="margin-bottom:16px"><div class="panel">${image('populacao','Várias capivaras adultas e jovens numa população do Pantanal')}<p class="caption">Propriedades emergentes: abundância, densidade, estrutura etária e taxas demográficas.</p></div><div class="panel peach"><h2>De um a muitos.</h2><p class="desc">Um único organismo não tem taxa populacional de natalidade ou densidade. Essas medidas caracterizam conjuntos definidos no espaço e no tempo.</p><div class="key">ΔN = nascimentos − mortes + imigração − emigração</div><button class="btn small" data-view="labpop">Testar outras 7 teorias populacionais →</button><div class="question">Que dados ajudariam a diferenciar emigração de mortalidade numa população monitorada?</div></div></div><div class="grid two"><div class="panel"><h3>Laboratório de crescimento</h3><p class="small muted">Mova os controles, formule uma hipótese e só então interprete a curva.</p><div class="inputs">${params.map(([k,label,min,max,step])=>`<div class="range"><label for="pop-${k}">${label} <output id="pop-${k}-val">${S.pop[k]}</output></label><input type="range" data-pop="${k}" id="pop-${k}" min="${min}" max="${max}" step="${step}" value="${S.pop[k]}"></div>`).join('')}</div><div class="actions"><button class="btn small" data-action="resetpop">↺ Reiniciar</button></div><div class="notice warn"><b>Modelo didático:</b> N(t+1)=N(t)+rN(t)[1−N(t)/K]+I−E, com r=b−d. Parâmetros hipotéticos; capacidade de suporte fixa e migração simplificada. Não reproduz a dinâmica real das capivaras.</div></div><div class="panel"><div class="flex"><h3>Trajetória populacional</h3><span class="badge peach">Simulação</span></div><div class="chart" id="popchart"></div><div class="grid three" style="margin-top:11px"><div class="metric"><b id="popnfinal">—</b><span>N após 30 etapas</span></div><div class="metric"><b id="popdelta">—</b><span>Variação absoluta</span></div><div class="metric"><b id="popr">—</b><span>r potencial</span></div></div><div class="actions"><button class="btn primary" data-view="comunidade">E se outras espécies interagirem? →</button></div></div></div>`}
function foodWebSVG(){const sp=[{i:0,x:110,y:200},{i:1,x:290,y:115},{i:2,x:290,y:294},{i:3,x:470,y:80},{i:4,x:500,y:295},{i:5,x:660,y:177}];const links=[[0,1],[0,2],[0,3],[1,2],[1,4],[2,4],[3,5],[4,5]];let removed=new Set(S.removed);let st=`<svg viewBox="0 0 780 365" role="img" aria-label="Rede trófica didática, setas de recurso para consumidor"><defs><marker id="fArrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0,1L9,5 0,9" stroke="#85af9f" stroke-width="2" fill="none"/></marker></defs><rect width="780" height="365" rx="14" fill="#eef6f0"/>`;links.forEach(([a,b])=>{const p=sp[a],q=sp[b];st+=`<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke="#97bbab" stroke-width="2.5" stroke-dasharray="${removed.has(a)||removed.has(b)?'4 7':'none'}" opacity="${removed.has(a)||removed.has(b)?'.18':'.8'}" marker-end="url(#fArrow)"/>`});sp.forEach(p=>{const a=SPECIES[p.i];st+=`<g opacity="${removed.has(p.i)?'.23':'1'}"><circle cx="${p.x}" cy="${p.y}" r="39" fill="white" stroke="#64a68c" stroke-width="3"/><text x="${p.x}" y="${p.y+10}" font-size="35" text-anchor="middle">${a.icon}</text>${textSvg(p.x,p.y+62,a.name,13)}</g>`});return st+`</svg>`}
function renderCommunity(){return `${title('Nível ecológico 03','Uma espécie nunca está sozinha.','Comunidades reúnem populações de espécies diferentes; as interações podem gerar consequências indiretas.')}<div class="grid two"><div class="panel">${image('comunidade','Comunidade pantaneira ilustrada com animais, plantas e água')}<p class="caption">Identifique os organismos, recursos, produtores e consumidores; a imagem ilustra possibilidades, não comprova relações alimentares específicas.</p></div><div class="panel peach"><h2>A propriedade que surge das relações.</h2><p class="desc">Riqueza, composição, equitabilidade, teias tróficas e interações dependem de mais de um indivíduo ou espécie.</p><div class="question"><b>Debata:</b> desaparecer um predador implica aumento de todas as espécies que ele consumia?</div><div class="actions"><button class="btn" data-view="medidas">Comparar riqueza e diversidade →</button><button class="btn primary" data-view="labcom">Testar competição, sucessão e colonização →</button></div></div></div><div class="grid two" style="margin-top:15px"><div class="panel"><h3>Teia ecológica explorável</h3><p class="small muted">Clique nas espécies para simular ausências. As setas mostram fluxo de recurso ao consumidor em uma rede didática.</p><div class="chart" style="margin:13px 0" id="webchart">${foodWebSVG()}</div><div class="actions"><button class="btn small" data-action="resetweb">↺ Restaurar rede</button></div></div><div class="panel"><h3>Retire ou recoloque uma espécie</h3><div class="grid three">${SPECIES.map((sp,i)=>`<button class="community-tile ${S.removed.includes(i)?'off':''}" data-species="${i}" aria-pressed="${!S.removed.includes(i)}"><span class="animal">${sp.icon}</span><strong>${sp.name}</strong><small>${S.removed.includes(i)?'Ausente':'Presente'}</small></button>`).join('')}</div><div class="notice" id="impactinfo" style="margin-top:14px">${S.removed.length?`Você retirou ${S.removed.map(i=>SPECIES[i].name).join(', ')}. Que efeitos diretos e indiretos propõe? Quais dados permitiriam testá-los?`:'Selecione uma espécie para criar um cenário de mudança e discutir hipóteses.'}</div><div class="hr"></div><div class="label">Interações além da alimentação</div><p class="desc small">Competição (−/−), predação (+/−), parasitismo (+/−), mutualismo (+/+), facilitação e cooperação. Os sinais representam efeitos simplificados, dependentes do contexto.</p></div></div><div class="notice warn" style="margin-top:15px">As ligações são <b>hipotéticas</b>. O jogo não calcula efeitos populacionais causais nem declara dietas empíricas. Para afirmações sobre o Pantanal, precisamos de estudos documentados.</div>`}
function fluxGraphic(){let s=`<svg viewBox="0 0 800 370" role="img" aria-label="Ciclo da matéria e fluxo unidirecional de energia"><rect width="800" height="370" rx="16" fill="#f0f6ef"/><circle cx="400" cy="183" r="132" fill="none" stroke="#86b89b" stroke-width="6" stroke-dasharray="8 10"/>`;const pts=[[400,65,'☀️','Radiação solar'],[620,190,'🌿','Produtores'],[400,300,'🐟','Consumidores'],[170,190,'🍄','Decompositores']];pts.forEach(([x,y,e,t])=>{s+=`<circle cx="${x}" cy="${y}" r="46" fill="white" stroke="#abd1b8" stroke-width="3"/><text x="${x}" y="${y+12}" font-size="35" text-anchor="middle">${e}</text>${textSvg(x,y+69,t,15)}`});s+=`<path d="M400 90C430 91 560 125 581 171M576 225Q489 317 448 305M349 304Q230 278 218 225M221 153Q285 85 353 74" stroke="#62a17e" stroke-width="4" fill="none" stroke-dasharray="7 8"/><rect x="312" y="151" width="176" height="69" rx="14" fill="#fff9ef" stroke="#e5cb9a"/>${textSvg(400,179,'Energia flui',18)}${textSvg(400,200,'Matéria circula',16,'#bc8c58')}</svg>`;return s}
function renderEcosystem(){const keys={normal:'ecossistema',dry:'pressao',recover:'recuperacao'},names={normal:'Água, solo, organismos e atmosfera',dry:'Hipótese de seca + fogo',recover:'Recuperação ecológica possível'};return `${title('Nível ecológico 04','Uma comunidade interage com o ambiente.','Alterar o regime de água modifica habitat, conectividade, processos e composição. Explore também balanços de água, carbono e energia.')}<div class="actions"><button class="btn primary" data-view="labeco">Abrir laboratório de ecossistemas e variáveis →</button><button class="btn" data-view="teorias">Ver teorias de Tansley, Lindeman e Odum</button></div><div class="grid two"><div class="panel"><div class="flex"><h3>Monte um cenário</h3><span class="badge peach">Ilustração, não monitoramento</span></div><div class="segment"><button class="${S.land==='normal'?'sel':''}" data-land="normal">Pulso de cheia</button><button class="${S.land==='dry'?'sel':''}" data-land="dry">Seca + fogo</button><button class="${S.land==='recover'?'sel':''}" data-land="recover">Recuperação</button></div><img class="statephoto" src="${IMAGES[keys[S.land]]}" alt="Ilustração original do Pantanal em cenário ${esc(names[S.land])}"><div class="caption">${names[S.land]} · cena fictícia criada para a aula.</div><div class="segment"><button class="layerbtn ${S.biotic?'on':''}" data-layer="biotic">🌿 Biótico ${S.biotic?'✓':'○'}</button><button class="layerbtn ${S.abiotic?'on':''}" data-layer="abiotic">💧 Abiótico ${S.abiotic?'✓':'○'}</button><button class="layerbtn ${S.light?'on':''}" data-layer="light">☀️ Energia ${S.light?'✓':'○'}</button></div><div class="notice" id="layerinfo">${layerExplanation()}</div></div><div class="panel"><h3>O que realmente forma o ecossistema?</h3>${fluxGraphic()}<div class="hr"></div><div class="question"><b>Hipótese para a turma</b><p>Como a interrupção da inundação pode alterar composição da comunidade, oxigênio dissolvido, dispersão de peixes e decomposição?</p></div><div class="notice warn">Este diagrama é conceitual. Energia entra e é dissipada; elementos químicos circulam. Não é correto representar energia como ciclo fechado.</div><div class="actions"><button class="btn primary" data-view="medidas">Como medir essas mudanças? →</button></div></div></div>`}
function layerExplanation(){return `Camadas ativas: ${[S.biotic?'organismos e suas interações':null,S.abiotic?'água, solo e atmosfera':null,S.light?'entrada de energia':null].filter(Boolean).join(' + ')||'nenhuma'}. Um ecossistema compreende interações e processos, não apenas as camadas isoladas.`}
function indexMetrics(arr){const N=arr.reduce((a,b)=>a+b,0);const S=arr.filter(x=>x>0).length;if(!N)return {N,S,H:0,D:0,J:null};const p=arr.filter(x=>x>0).map(x=>x/N);const H=-p.reduce((a,b)=>a+b*Math.log(b),0);const D=1-p.reduce((a,b)=>a+b*b,0);const J=S>1?H/Math.log(S):null;return {N,S,H,D,J}}
function formatNum(v){return v===null?'—':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:3,maximumFractionDigits:3})}
function barGraph(vals,rank=false){const arr=rank?[...vals].sort((a,b)=>b-a):vals;const w=600,h=285,plotH=210,max=Math.max(1,...arr)*1.08;let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${rank?'Ranking de abundância':'Gráfico de abundâncias'}"><rect width="600" height="285" fill="white"/>`;for(let j=0;j<5;j++){let y=35+j*plotH/4;s+=`<line x1="40" x2="580" y1="${y}" y2="${y}" stroke="#e3ece5"/>${textSvg(33,y+4,Math.round(max*(1-j/4)),11,'#7a9487','end')}`};arr.forEach((v,i)=>{let x=72+i*128,y=245-v*plotH/max;s+=`<rect x="${x}" y="${y}" width="72" height="${245-y}" rx="8" fill="${['#4b9e83','#76b29a','#b0c4a0','#d8ad88'][i]}"/>${textSvg(x+36,y-8,String(v),15)}${textSvg(x+36,266,rank?String(i+1):'Esp. '+(i+1),12)}`});s+=`</svg>`;return s}
function rankGraph(arr){const values=[...arr].filter(n=>n>0).sort((a,b)=>b-a);const w=580,h=265,max=Math.max(...values,1);const coords=values.map((v,i)=>[75+390*i/Math.max(1,values.length-1),200-(v/max)*145]);let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Curva de ranking de abundância"><rect width="580" height="265" fill="#fff"/>${[0,1,2,3,4].map(i=>`<line x1="65" x2="500" y1="${55+i*38}" y2="${55+i*38}" stroke="#e3ece5"/>`).join('')}<path d="${coords.map(([x,y],i)=>`${i?'L':'M'}${x} ${y}`).join(' ')}" fill="none" stroke="#478f73" stroke-width="4"/>${coords.map(([x,y],i)=>`${circ(x,y,6,'#d38f66')}${textSvg(x,y-11,String(values[i]),13)}`).join('')}${textSvg(280,254,'Posição na ordem de abundância',12)}${textSvg(40,32,'Nº de indivíduos',12)}</svg>`;return s}
function updateMetrics(){if(S.view!=='medidas')return;['A','B'].forEach(k=>{const m=indexMetrics(S.counts[k]);const el=$('#index'+k);if(el)el.innerHTML=`${[['N',m.N],['S',m.S],['Shannon H′',formatNum(m.H)],['Gini–Simpson 1−D',formatNum(m.D)],['Pielou J′',formatNum(m.J)]].map(([x,y])=>`<div class="indexcard"><div class="micro">${x}</div><b>${y}</b></div>`).join('')}`;const ch=$('#abund'+k);if(ch)ch.innerHTML=barGraph(S.counts[k]);const rk=$('#rank'+k);if(rk)rk.innerHTML=rankGraph(S.counts[k]);S.counts[k].forEach((v,i)=>{let p=$('#count'+k+i);if(p)p.value=v})})}
function renderMeasures(){return `${title('Laboratório estatístico · básico e rigoroso','Riqueza não é o mesmo que diversidade.','Altere as abundâncias de duas comunidades hipotéticas. O cálculo e os gráficos mudam juntos. Sem dados inventados apresentados como observações.')}<div class="notice" style="margin-bottom:17px"><b>Objetivo:</b> comparar comunidades com a mesma riqueza, mas diferentes abundâncias relativas. Todos os exemplos são hipotéticos; você pode digitar seus próprios valores.</div><div class="grid two">${['A','B'].map(k=>`<div class="panel"><div class="flex"><h3>Comunidade ${k}</h3><span class="badge peach">Valores editáveis</span></div><div class="countercol">${S.counts[k].map((v,i)=>`<div class="row-input"><label for="count${k}${i}">Espécie ${i+1}</label><input id="count${k}${i}" data-count="${k}-${i}" type="number" min="0" max="9999" step="1" value="${v}"></div>`).join('')}</div><div class="grid two" style="margin-top:13px" id="index${k}"></div><h3 style="margin-top:17px">Abundância por espécie</h3><div class="chart" id="abund${k}"></div><h3 style="margin-top:17px">Ranking de abundância</h3><div class="chart" id="rank${k}"></div></div>`).join('')}</div><div class="actions"><button class="btn" data-action="resetdiv">↺ Exemplos: 25/25/25/25 × 97/1/1/1</button><button class="btn" data-action="equaldiv">Distribuir todos igualmente</button><button class="btn primary" data-view="conservacao">Aplicar à conservação →</button></div><div class="grid two" style="margin-top:15px"><div class="panel"><h3>O que cada índice mede?</h3><div class="table-wrap"><table><thead><tr><th>Medida</th><th>Significado</th></tr></thead><tbody><tr><td>N</td><td>Total de indivíduos</td></tr><tr><td>S</td><td>Número de espécies com abundância positiva</td></tr><tr><td>H′</td><td>Shannon: incorpora riqueza e proporções</td></tr><tr><td>1−D</td><td>Gini–Simpson: probabilidade de duas amostras independentes pertencerem a espécies diferentes</td></tr><tr><td>J′</td><td>Pielou: equitabilidade, H′/ln(S) quando S ≥ 2</td></tr></tbody></table></div></div><div class="panel"><h3>Como interpretar?</h3><p class="desc">As curvas de ranking decrescem com a ordem de abundância. Quanto mais desigual a distribuição de abundâncias, maior tende a ser a inclinação.</p><details class="collapsible"><summary>Ver fórmulas e pressupostos</summary><div><b>pᵢ=nᵢ/N</b>; Shannon <b>H′=−Σpᵢ ln(pᵢ)</b>; Gini–Simpson <b>1−Σpᵢ²</b>; Pielou <b>J′=H′/ln(S)</b>. Termos com pᵢ=0 contribuem zero. Unidades são adimensionais; comparar amostras exige cuidado com esforço amostral, detectabilidade e cobertura.</div></details><div class="notice warn">Mesmo índice pode esconder estruturas diferentes. <b>Riqueza observada depende da amostragem.</b> Registros de GBIF não são contagem populacional.</div></div></div><div class="grid two" style="margin-top:15px"><div class="panel"><h3>Estatística ecológica de entrada</h3><p class="desc">Comece por média, mediana, amplitude e desvio-padrão antes de comparar grupos. Dados simples: temperatura da água (°C) em 6 pontos hipotéticos.</p><div id="basicstats">${basicStats([27,28,28,30,31,33])}</div></div><div class="panel"><h3>Para a sala de aula</h3><p class="desc">1. Amostrar plantas ou invertebrados em quadrats ou transectos. 2. Definir área e esforço. 3. Registrar abundâncias por espécie. 4. Comparar riqueza e índices. 5. Explicar limites da inferência.</p><button class="btn" data-topic="c28">Amostragem e dados →</button></div></div>`}
function basicStats(a){let s=[...a].sort((x,y)=>x-y);let avg=a.reduce((u,v)=>u+v,0)/a.length;let sd=Math.sqrt(a.reduce((u,v)=>u+(v-avg)**2,0)/(a.length-1));let med=(s[2]+s[3])/2;return `<div class="grid four">${[['Média',avg.toFixed(1)+' °C'],['Mediana',med.toFixed(1)+' °C'],['Amplitude',(s.at(-1)-s[0]).toFixed(1)+' °C'],['Desvio amostral',sd.toFixed(2)+' °C']].map(([x,y])=>`<div class="metric"><b>${y}</b><span>${x}</span></div>`).join('')}</div><p class="micro" style="margin-top:10px">Valores pedagógicos: ${a.join('; ')} °C. Não são medições do Pantanal.</p>`}

ards">${[

['eBird','🦜','Listas de aves e contexto de amostragem.','ebird'],

ientes úmidos e trocas de água pela pele.","répteis":"Grupo didático de vertebrados amniotas; em filogenia moderna, aves pertencem à linhagem dos répteis.","habitats":"Locais e condições ambientais onde organismos se estabelecem e usam recursos.","aves":"Vertebrados endotérmicos com penas; participam de cadeias tróficas, dispersão e outras interações.","mamíferos":"Vertebrados com glândulas mamárias e pelos em alguma fase da vida, com ecologias diversificadas.","ser humano":"Mamífero da espécie Homo sapiens; modifica e é afetado por processos ecológicos.","comportamento":"Ações de organismos em resposta a condições internas e estímulos externos.","nichos":"Conjuntos multidimensionais de condições, recursos e interações associados à persistência de populações.","genótipo × ambiente":"Interação entre constituição genética e condições ambientais na formação de características observáveis.","fenótipo":"Características mensuráveis de um organismo resultantes de genes, ambiente e desenvolvimento.","plasticidade":"Capacidade de um genótipo produzir fenótipos diferentes em ambientes distintos sem exigir evolução genética.","tolerância":"Faixa de condições ambientais na qual um organismo consegue manter determinadas funções.","habitat":"Local ou tipo de ambiente em que o organismo vive, em uma escala espacial definida.","nicho fundamental/realizado":"Nicho fundamental: condições potenciais sem certas restrições bióticas; realizado: parte ocupada sob interações e dispersão efetivas.","limitações":"Restrições fisiológicas, ecológicas, espaciais ou históricas à ocorrência e ao desempenho.","n":"Símbolo usual para o número de indivíduos de uma população em momento e área definidos.","indivíduos/área":"Unidade de densidade populacional, obtida dividindo-se indivíduos por área amostrada.","agregada, uniforme, aleatória":"Padrões espaciais: indivíduos em grupos, espaçados mais regularmente ou distribuídos sem estrutura evidente.","natalidade":"Entrada de indivíduos por reprodução em uma população durante um intervalo de tempo.","mortalidade":"Perda de indivíduos por morte por unidade de tempo ou intervalo definido.","imigração":"Entrada de indivíduos vindos de outras populações ou áreas.","emigração":"Saída de indivíduos para outras populações ou áreas.","crescimento exponencial/logístico":"Exponencial: crescimento proporcional a N com r constante. Logístico: taxa per capita diminui com N/K.","k":"Capacidade de suporte em modelo, isto é, tamanho de referência no qual o crescimento líquido dependente da densidade se anula.","dispersão":"Movimento de organismos ou propágulos que pode alterar distribuição e conectividade entre populações.","espécies":"Unidades taxonômicas de biodiversidade; o conceito de espécie varia conforme a linhagem e o método.","composição":"Identidade das espécies ou grupos presentes em uma comunidade, independentemente da riqueza isolada.","riqueza":"Número de espécies detectadas em uma unidade amostral e esforço especificados.","abundância relativa":"Proporção de indivíduos ou registros atribuída a uma espécie em relação ao total.","competição":"Interação em que o uso de recurso ou interferência pode reduzir o desempenho de participantes.","predação":"Interação em que um organismo consome outro, causando sua morte ou remoção de tecido.","parasitismo":"Relação em que um organismo obtém recursos de um hospedeiro com prejuízo a este.","mutualismo":"Interação entre espécies com benefício líquido para ambas em um contexto definido.","facilitação":"Interação na qual uma espécie melhora condições ou recursos disponíveis a outra.","produtor":"Organismo que forma biomassa a partir de carbono inorgânico usando energia luminosa ou química.","consumidor":"Organismo que obtém energia e matéria ao se alimentar de outros seres vivos ou matéria orgânica.","decompositor":"Organismo que transforma detritos, contribuindo para ciclagem de nutrientes.","teia":"Rede de relações alimentares que liga múltiplas espécies e níveis tróficos.","cas riqueza s":"S: número de espécies observadas na amostra, não a abundância total.","abundância n":"N: total de indivíduos contados, não o número de espécies.","pielou":"Índice de equitabilidade J′ = H′/ln(S), definido para S > 1, que mede uniformidade relativa.","shannon h'":"Entropia H′ = −Σpᵢ ln(pᵢ), sensível à riqueza e à distribuição das abundâncias.","gini-simpson 1−d":"Índice 1−Σpᵢ², probabilidade de dois indivíduos sorteados pertencerem a espécies diferentes sob amostragem idealizada.","equitabilidade j'":"Índice de uniformidade das abundâncias: J′ = H′/ln(S) quando S > 1.","ordenação por abundância":"Classificação das espécies da mais abundante para a menos abundante.","declividade":"Inclinação da curva de ranking; declive maior geralmente indica dominância mais pronunciada.","espécies raras":"Espécies com baixa abundância na amostra; podem ser subdetectadas conforme esforço amostral.","média":"Soma dos valores dividida pelo número de observações.","mediana":"Valor central após ordenar os dados; pouco sensível a extremos.","desvio":"Medida de dispersão; desvio-padrão quantifica a variação dos dados em relação à média.","intervalos":"Faixas de valores usadas para quantificar dispersão ou incerteza, conforme a construção.","comparação":"Contraste entre grupos, locais ou períodos considerando desenho, escala e variabilidade.","correlação":"Associação estatística entre variáveis, que não demonstra causalidade isoladamente.","cr":"Criticamente em Perigo: categoria de risco de extinção extremamente elevado na natureza.","en":"Em Perigo: categoria de risco de extinção muito elevado na natureza.","vu":"Vulnerável: categoria de risco elevado de extinção na natureza.","nt":"Quase Ameaçada: perto de preencher critérios de categoria ameaçada ou provavelmente os preencherá no futuro próximo.","lc":"Menos Preocupante: não atende aos limiares de ameaça no momento da avaliação; não implica ausência de risco futuro.","dd":"Dados Insuficientes: evidências inadequadas para avaliar diretamente o risco de extinção.","status e tendência":"Status: categoria de avaliação; tendência: direção da mudança populacional ao longo do tempo.","ocorrência":"Registro de presença de organismo em lugar e data, sujeito a identificação e qualidade de coordenadas.","distribuição":"Padrão geográfico da presença de táxons; registros observados não equivalem à distribuição completa.","georreferenciamento":"Associação de uma observação a coordenadas e incerteza espacial explícita.","identificação":"Atribuição de nome taxonômico a um organismo com base em caracteres e/ou evidências genéticas.","taxonomia":"Ciência de descrever, nomear e classificar a biodiversidade.","cobertura":"Tipo de cobertura do solo, como vegetação, água ou área construída.","fogo":"Combustão de biomassa que pode atuar como processo ecológico e perturbação, conforme regime e contexto.","água":"Substância H₂O que compõe compartimentos ecológicos e transporta calor, solutos e organismos.","pergunta":"Problema específico cuja resposta pode ser investigada por observação ou experimento.","variáveis":"Atributos que variam entre unidades, lugares, indivíduos ou momentos; podem ser respostas ou preditores.","coleta":"Obtenção de observações ou amostras com protocolo explícito e rastreável.","interpretação":"Construção de explicações a partir de padrões, métodos, limites e incerteza das evidências.","mudança conceitual":"Reorganização de ideias após confrontar concepções anteriores com evidências e explicações.","metacognição":"Capacidade de reconhecer e avaliar o próprio processo de aprendizagem.","evidência":"Observação ou resultado que sustenta ou refuta previsões em um contexto e método definidos."};

// Demonstração didática: balanço massivo de CH4 em um compartimento hipotético.
// Resultado em unidades relativas por dia, não emissão real medida ou prevista.
function sciMethaneBudget(p){
 const production=[],oxidation=[],emission=[],storage=[],diffusion=[],ebullition=[],plantTransport=[];
 let stock=0,maxResidual=0;
 for(let day=0;day<=30;day++){
  const wet=Math.max(0,Math.min(1,p.alag/100));
  const oxy=Math.max(0,Math.min(1,p.oxigenio/100));
  const labile=Math.max(0,Math.min(1,p.carbono/100));
  const plant=Math.max(0,Math.min(1,(p.plantas??40)/100));
  const tempDay=p.temp+1.5*Math.sin(day/4);
  const q10Factor=Math.pow(p.q10,(tempDay-25)/10);
  // Producao: substrato, saturacao, microambientes anaerobios e temperatura.
  const anoxia=(0.1+0.9*wet)*(0.12+0.88*(1-oxy));
  const P=8*labile*anoxia*q10Factor;
  const before=stock,available=before+P;
  // Oxidacao efetiva limitada pelo estoque; termo aeróbio e proxy anaeróbio.
  const oxRate=0.03+0.24*oxy*(1-0.6*wet)+0.012*(1-oxy);
  const O=Math.min(available,available*oxRate);
  const mobile=available-O;
  // Vias simplificadas: difusao, aerênquima e ebulição limiar-dependente.
  const fDiff=0.07*(1-0.55*wet);
  const fPlant=0.22*plant*(0.2+0.8*wet);
  const fBubble=0.16*wet*Math.max(0,(mobile-3)/(mobile+5));
  const Fd=mobile*fDiff,Fp=mobile*fPlant,Fb=mobile*fBubble;
  const F=Fd+Fp+Fb;
  stock=Math.max(0,mobile-F);
  maxResidual=Math.max(maxResidual,Math.abs(before+P-O-F-stock));
  production.push(P);oxidation.push(O);emission.push(F);storage.push(stock);
  diffusion.push(Fd);plantTransport.push(Fp);ebullition.push(Fb);
 }
 const sum=a=>a.reduce((x,y)=>x+y,0);
 return {production,oxidation,emission,storage,diffusion,plantTransport,ebullition,maxResidual,
  totals:{production:sum(production),oxidation:sum(oxidation),emission:sum(emission),diffusion:sum(diffusion),plantTransport:sum(plantTransport),ebullition:sum(ebullition)}};
}
function sciMethanePathways(m){if(!m)return '';const total=m.totals.emission||0;
 const ways=[['Difusão',m.totals.diffusion,'#497da8'],['Pelas plantas',m.totals.plantTransport,'#358c72'],['Ebulição',m.totals.ebullition,'#d08b58']];
 return `<div class="sci-path-title">Como o CH₄ chegou à atmosfera? <span>participação das vias no fluxo simulado</span></div>${ways.map(([name,value,color])=>`<div class="sci-path-row"><span>${name}</span><div class="sci-path-track"><i style="width:${total?Math.min(100,100*value/total):0}%;background:${color}"></i></div><b>${total?sciFormat(100*value/total,1):'0,0'}%</b></div>`).join('')}<p class="caption">As proporções são resultados hipotéticos, dependentes dos coeficientes do exercício, não medições do Pantanal.</p>`;
}

function sciGraph(series,opts={}){
 const arr=series.filter(x=>x.values?.length),n=arr[0]?.values.length||0;if(!n)return '<p>Sem valores para representar.</p>';
 const w=900,h=320,left=63,right=23,top=24,bottom=43;
 const vv=arr.flatMap(x=>x.values).filter(Number.isFinite);let min=Math.min(0,...vv),max=Math.max(1,...vv);let scale=max-min;if(scale===0)scale=1;
 const X=i=>left+(w-left-right)*(i/Math.max(1,n-1)),Y=y=>top+(h-top-bottom)*(1-(y-min)/scale);
 let out=`<svg class="sci-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(opts.label||'Gráfico de simulação ecológica')}"><rect x="0" y="0" width="${w}" height="${h}" rx="16" fill="#fff"/>`;
 for(let k=0;k<=4;k++){const v=min+scale*(1-k/4),yy=Y(v);out+=`<line x1="${left}" y1="${yy}" x2="${w-right}" y2="${yy}" stroke="#e3eee7"/><text x="${left-12}" y="${yy+5}" font-size="13" fill="#72887f" text-anchor="end">${sciFormat(v,Math.abs(v)<20?1:0)}</text>`}
 for(let k=0;k<=4;k++){let xx=left+(w-left-right)*k/4;out+=`<text x="${xx}" y="${h-17}" font-size="12" text-anchor="middle" fill="#778a80">${Math.round((n-1)*k/4)}</text>`}
 arr.forEach(x=>{const vals=x.values.map((y,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(sciClamp(y,min,max)).toFixed(1)).join(' ');out+=`<path d="${vals}" fill="none" stroke="${x.color||'#216f60'}" stroke-width="${x.dashed?'2.5':'3.6'}" stroke-dasharray="${x.dashed?'7 6':'none'}" stroke-linecap="round" stroke-linejoin="round"/>`});
 out+=`<text x="${w/2}" y="${h-1}" text-anchor="middle" font-size="12" fill="#748b7c">${esc(opts.xLabel||'Etapas simuladas')}</text></svg>`;
 out+=`<div class="sci-legend">${arr.map(x=>`<span><i style="background:${x.color}"></i>${esc(x.name)}</span>`).join('')}</div>`;return out
}
function sciCompute(model){const p=SCI.params[model],arr=[],series=[],metrics=[],island=(x)=>Number.isFinite(x)?x:0;let note='';
 function push(name,values,color){series.push({name,values:values.map(v=>Number.isFinite(v)?v:0),color})}
 if(model==='carbono'){
  const gpp=[],er=[],net=[];const t=p.temp, ftemp=Math.exp(-Math.pow((t-27)/15,2)), fwater=.14+.86*p.agua/100,fnutr=.25+.75*p.nutr/100,resp=1.9*Math.pow(p.q10,(t-25)/10)*(.45+.55*p.agua/100);
  for(let h=0;h<24;h++){let par=p.par*Math.max(0,Math.sin(Math.PI*(h-6)/12)),g=18*par/(par+320||1)*ftemp*fwater*fnutr;const e=resp;gpp.push(g);er.push(e);net.push(e-g)}
  push('GPP (índice)',gpp,'#16856f');push('ER (índice)',er,'#d28a55');push('NEE aproximado (ER − GPP)',net,'#7c90bb');
  const totalG=gpp.reduce((a,b)=>a+b,0),totalR=er.reduce((a,b)=>a+b,0);metrics.push(['GPP integrado',totalG,'u.a.·h'],['ER integrado',totalR,'u.a.·h'],['NEE diário aproximado',totalR-totalG,'u.a.·h']);note=(totalR-totalG<0?'NEE negativo: remoção líquida de CO₂ da atmosfera no cenário.':'NEE não negativo: emissão líquida de CO₂ para a atmosfera no cenário.')+' Isso não é estimativa de acúmulo total de C: trocas laterais, incêndios e transporte aquático foram omitidos.';
 }else if(model==='metano'){
  const mb=sciMethaneBudget(p);
  push('Produção bruta (u.a./dia)',mb.production,'#358c72');
  push('Oxidação (u.a./dia)',mb.oxidation,'#d08b58');
  push('Emissão à atmosfera (u.a./dia)',mb.emission,'#497da8');
  const mean=a=>a.reduce((u,v)=>u+v,0)/a.length;
  metrics.push(['Produção média',mean(mb.production),'u.a./dia'],['Oxidação média',mean(mb.oxidation),'u.a./dia'],['Emissão média',mean(mb.emission),'u.a./dia'],['Estoque final',mb.storage.at(-1),'u.a.']);
  SCI.methaneLast=mb;
  note='Taxas de produção, oxidação e emissão são distintas; a água não tem efeito universalmente monotônico. Difusão, bolhas e plantas compartilham o estoque disponível. Erro máximo de fechamento do balanço: '+sciFormat(mb.maxResidual,5)+' u.a. (arredondamento numérico).';
 }else if(model==='agua'){
  const supply=p.chuva+p.entrada,requested=p.et+p.saida+p.dreno;let storage=p.estoque;
  const a=[storage];let actualExit=0,unmet=0;
  for(let t=1;t<=14;t++){
    const available=storage+supply,exit=Math.min(available,requested);
    storage=available-exit;actualExit+=exit;unmet+=requested-exit;a.push(storage)
  }
  const nominalDelta=supply-requested;
  push('Estoque hídrico efetivo (mm)',a,'#3186ad');
  metrics.push(['Saldo nominal diário',nominalDelta,'mm/dia'],['Estoque ao dia 14',storage,'mm'],['Saída não atendida',unmet,'mm']);
  note=unmet>0?'Houve demanda de saída maior que a água disponível. Para fechar o balanço, as saídas efetivas foram limitadas e o déficit acumulado ficou explícito.':'Balanço de 14 dias fechado sem limitação de saídas. Todos os fluxos são convertidos para mm/dia sobre a mesma área.';
 }else if(model==='energia'){
  const a=[p.prod];for(let i=1;i<p.niveis;i++)a.push(a[i-1]*p.ef/100);push('Energia disponível',a,'#3d8d7f');metrics.push(['Produtores',a[0],'u.a.'],['Último nível',a.at(-1),'u.a.'],['Parcela no topo',100*a.at(-1)/a[0],'%']);note=`Transferência hipotética de ${p.ef}% por nível. A eficiência real varia, e a energia não é reciclada como nutrientes.`;
 }else if(model==='pulso'){
  const water=[],habitat=[];for(let m=0;m<24;m++){const wave=Math.max(0,Math.cos(2*Math.PI*(m%12-p.periodo)/12)),h=p.base+p.amplitude*wave;water.push(h);habitat.push(2.5*(p.conex/100)*(1-Math.exp(-h/2)))}push('Nível da água (m)',water,'#2985a0');metrics.push(['Nível máximo',Math.max(...water),'m'],['Acesso a habitat no pico',Math.max(...habitat),'índice'],['Meses acima de 2 m',water.slice(0,12).filter(x=>x>2).length,'meses/ano']);note='A curva usa apenas nível da água em metros. O acesso a habitat aparece como métrica separada por ter unidades diferentes; é um índice hipotético dependente de conectividade e nível.';
 }else if(['exponencial','logistico','allee','ricker','beverton'].includes(model)){
  let n=p.n;const a=[n];for(let t=1;t<=40;t++){
   if(model==='exponencial')n=n*Math.exp(p.r);
   else if(model==='logistico')n=n+(.2*p.r*n*(1-n/p.k))*5;
   else if(model==='allee')n=n+(.2*p.r*n*(1-n/p.k)*(n/p.a-1))*5;
   else if(model==='ricker')n=n*Math.exp(p.r*(1-n/p.k));
   else n=(p.lambda*n)/(1+(p.lambda-1)*n/p.k);
   n=sciClamp(n,0,2e5);a.push(n)
  }
  push('Tamanho populacional (N)',a,'#287b68');if(p.k)push('K (referência)',a.map(()=>p.k),'#d59c60');if(model==='allee')push('Limiar Allee A',a.map(()=>p.a),'#9c79b1');metrics.push(['N inicial',a[0],'ind.'],['N final',a.at(-1),'ind.'],['Variação',a.at(-1)-a[0],'ind.']);note=model==='allee'&&p.n<p.a?'Como N₀ está abaixo de A, o declínio é uma consequência do modelo de efeito Allee forte.':'Compare taxa inicial, estabilidade, oscilações e condição de equilíbrio.';
 }else if(model==='metapop'){
  let x=p.p/100,a=[p.p];for(let t=1;t<=60;t++){x=sciClamp(x+.35*(p.c*x*(1-x)-p.e*x),0,1);a.push(x*100)}push('Manchas ocupadas (%)',a,'#378e78');metrics.push(['Ocupação inicial',p.p,'%'],['Ocupação final',a.at(-1),'%'],['c − e',p.c-p.e,'etapa⁻¹']);note=p.c>p.e?'A colonização pode sustentar ocupação positiva se ela já existir.':'Sem recolonização suficiente, a fração ocupada tende a zero.';
 }else if(model==='predpresa'){
  let n=p.presa,y=p.predador;const x=[n],z=[y];for(let t=1;t<=150;t++){const dn=p.r*n*(1-n/p.k)-p.a*n*y,dy=p.conv*p.a*n*y-p.mort*y;n=sciClamp(n+.1*dn,0,2000);y=sciClamp(y+.1*dy,0,2000);if(t%3===0){x.push(n);z.push(y)}}push('Presas',x,'#2b8b76');push('Predadores',z,'#d18b57');metrics.push(['Presas finais',x.at(-1),'ind.'],['Predadores finais',z.at(-1),'ind.'],['Pico de predadores',Math.max(...z),'ind.']);note='Oscilações dependem dos parâmetros e de mecanismos omitidos: resposta funcional, refúgios, clima e estrutura etária.';
 }else if(model==='competicao'){

function simPred(p,id){let prey=p.prey,pred=p.pred,preys=[prey],preds=[pred];
 const years=30,steps=12*years;
 for(let j=1;j<=steps;j++){
  const dt=1/12,t=j*dt,season=id==='pantanal'?1+p.clima/100*.25*Math.sin(t*2*Math.PI):1;
  const food=p.attack*(1-p.refuge/100)*prey/(p.half+prey),k=p.k*(id==='pantanal'?1+.10*(p.clima/100)*Math.sin(2*Math.PI*t):1);
  const dPrey=p.r*season*prey*(1-prey/k)-food*pred;
  const alt=id==='pantanal'? .34*p.alt/100:0;
  const dPred=pred*(p.eff/100*food +alt-p.mort);
  prey=clamp(prey+dt*dPrey,0,2.5*p.k);pred=clamp(pred+dt*dPred,0,160);
  if(prey<.00001)prey=0;if(pred<.00001)pred=0;
  if(j%12===0){preys.push(prey);preds.push(pred)}
 }
 return {x:Array.from({length:years+1},(_,i)=>i),series:[{name:id==='elton'?'Lebres':'Capivaras',color:styles.prey,y:preys},{name:id==='elton'?'Linces':'Onças',color:styles.pred,y:preds}],unit:'Índices de abundância hipotéticos',xLabel:'Anos simulados',conclusion:preys.at(-1)===0?'Presa desapareceu no cenário: teste condições de menor pressão.':'Oscilação, estabilidade e redução dependem conjuntamente das taxas e dos recursos.',metrics:[['Presa no fim',preys.at(-1),'índice'],['Predador no fim',preds.at(-1),'índice'],['Predador máximo',Math.max(...preds),'índice']]};
}
function simCerrado(p){let g=45,w=p.lenhosas,A=[],B=[];for(let t=0;t<=40;t++){
 A.push(g);B.push(w);g+=.28*(p.chuva/100)*(100-g)*g/100;w+=.12*(p.chuva/100)*(100-w)*w/100;
 if(p.fogo&&t>0&&(t+1)%p.fogo===0){g*=1-.44*p.sever/100*(1-p.rebrote/100*.55);w*=1-.76*p.sever/100*(1-p.rebrote/100*.28)}
 g=clamp(g,0,100);w=clamp(w,0,100)}return multi('Anos','Índice relativo de cobertura (%)',A,B,'Herbáceas','Lenhosas','A frequência e a intensidade do fogo modificam grupos com resistência e recuperação distintas.');}
function simCaatinga(p){let soil=25,seed=p.semente,water=[],recr=[],total=0;for(let m=0;m<36;m++){
  const month=m%12,wet=[11,0,1,2,3].includes(month);
  const season= p.chuva * (wet? (1.0+p.concen/100*1.5):(.35 + (1-p.concen/100)*.65)) / (5*(1+p.concen/100*1.5)+7*(.35+(1-p.concen/100)*.65));
  soil=clamp(soil+season*p.retencao/100-p.et,0,120);
  const germ=clamp((soil-15)/55,0,1)*seed*.45;
  seed=clamp(seed+8-germ*.27,0,100);
  water.push(soil/1.2);recr.push(germ);
 }
 return {x:Array.from({length:36},(_,i)=>i+1),series:[{name:'Água no solo',color:styles.prey,y:water},{name:'Emergência potencial',color:styles.pred,y:recr}],unit:'Índices 0–100 (%)',xLabel:'Mês simulado',conclusion:'O modelo preserva o total anual hipotético de chuva; sua distribuição entre meses altera janelas de água disponível.',metrics:[['Água média',avg(water),'índice %'],['Emergência média',avg(recr),'índice %']]};
}
function simAmazonia(p){let h=[],r=[];for(let m=0;m<48;m++){
  const phase=m%12,months=clamp(p.dur,1,11),isWet=phase<months;
  const habitat=isWet ? p.con/100*clamp(p.cheia/6,0,1)*Math.sin(Math.PI*(phase+.6)/months):0;
  h.push(100*habitat);
  let fish=100*habitat*(1-p.pesca/100)*p.ox/100;
  r.push(clamp(fish,0,100));
 }
 const lagged=r.map((_,i)=>i===0?0:.65*r[i-1]+.35*r[Math.max(0,i-2)]);
 return {x:Array.from({length:48},(_,i)=>i+1),series:[{name:'Habitat acessível',color:styles.prey,y:h},{name:'Recrutamento posterior',color:styles.pred,y:lagged}],unit:'Índices 0–100 (%)',xLabel:'Mês simulado',conclusion:'Há uma defasagem ilustrativa entre a cheia e o recrutamento de juvenis. Não é previsão de um estoque pesqueiro.',metrics:[['Acesso máximo',Math.max(...h),'índice %'],['Recrutamento médio',avg(lagged),'índice %']]};
}
function simMata(p){const base=100*Math.sqrt(p.cob/100)*Math.sqrt(p.con/100)*(1-p.agro/100)*(.25+.75*p.flor/100)*(.35+.65*p.div/100);let x=30,y=15;let a=[x],b=[y];for(let t=1;t<=48;t++){x=clamp(x+.12*(base-x),0,100);y=clamp(y+.09*(.83*x-y),0,100);a.push(x);b.push(y)}return multi('Meses','Índices funcionais 0–100 (%)',a,b,'Interação planta–polinizador','Frutificação hipotética','O índice combina paisagem e recursos: não mede fecundação de uma espécie real.');}
function simMangue(p){const fitness=Math.exp(-.5*Math.pow((p.sal-p.otimo)/p.tol,2))*(.30+.70*p.mare/100)*p.prop/100;let x=10,a=[x],b=[100*fitness];for(let t=1;t<=36;t++){x=clamp(x+.10*(100*fitness-x),0,100);a.push(x);b.push(100*fitness)}return multi('Meses','Índice funcional 0–100 (%)',a,b,'Estabelecimento acumulado','Adequação ambiental','O ótimo de salinidade é uma hipótese específica deste organismo fictício; outras espécies apresentam respostas diferentes.');}
function simCidade(p){const ip=p.imper/100,veg=p.verde/100,inf=p.inf/100;
 const imperRun=p.chuva*ip*.91;
 const permeavel=p.chuva*(1-ip),greenCatch=permeavel*(veg*.28),soilInf=(permeavel-greenCatch)*inf*.76;
 const runoff=imperRun+(permeavel-greenCatch-soilInf)*.58;
 const retained=p.chuva-runoff;
 const series=[{name:'Escoamento rápido',color:styles.pred,y:[runoff]},{name:'Infiltração + retenção + outras perdas',color:styles.prey,y:[retained]}];
 return {x:[0],series,unit:'mm por evento',xLabel:'Evento hipotético',kind:'bars',conclusion:'Fechamento ilustrativo: chuva = escoamento rápido + infiltração/retenção e outras perdas. Não representa pico de vazão nem risco de enchente.',metrics:[['Escoamento',runoff,'mm'],['Retenção e demais perdas',retained,'mm'],['Fração escoada',100*runoff/p.chuva,'%']],residual:Math.abs(p.chuva-runoff-retained)};}
function multi(xLabel,unit,a,b,n1,n2,conclusion){return {x:Array.from({length:a.length},(_,i)=>i),series:[{name:n1,color:styles.prey,y:a},{name:n2,color:styles.pred,y:b}],xLabel,unit,conclusion,metrics:[[n1+' no fim',a.at(-1),'índice'],[n2+' no fim',b.at(-1),'índice']]};}

 <details class="br-equation"><summary>Como esta simulação calcula?</summary><p>${e(RULES[c.id])}</p></details><div class="br-actions">${btn('↺ Restaurar','data-br-reset="1" class="br-btn"')}${btn('⚡ Aplicar perturbação','data-br-perturb="1" class="br-btn"')}${btn('◌ Fixar referência','data-br-baseline="1" class="br-btn primary"')}</div></section>
 <section class="br-panel br-result"><div class="br-flex"><h3>Resultado dinâmico</h3><span class="br-badge" id="br-plot-badge">Calculado agora</span></div><div class="br-canvas" id="br-chart"></div><div class="br-metrics" id="br-metrics"></div><div class="br-explanation" id="br-note"></div><label for="br-time" class="br-step-label">Explorar o tempo: <output id="br-step-text">—</output></label><input id="br-time" type="range" min="0" max="30" value="0" step="1" data-br-time="1"/><div class="br-actions">${btn('▶ Reproduzir evolução','data-br-play="1" class="br-btn"')}${btn('⏸ Parar','data-br-pause="1" class="br-btn"')}</div><p class="br-small" id="br-saved">Fixe uma curva de referência e altere uma variável para testar outra hipótese.</p></section></div>
 <div class="br-panels"><section class="br-panel br-insight"><h3>Hipótese para debate</h3><p>${e(c.question)}</p><div class="br-sub"><strong>Mecanismo representado</strong><p>${e(c.process)}</p></div><div class="br-sub"><strong>Limites e pressupostos</strong><p>${e(c.limitation)}</p></div></section><section class="br-panel"><h3>Do modelo para o campo</h3><p>${e(c.field)}</p><p class="br-small">Trate simulação e observação como evidências diferentes. Para resultados empíricos, defina espécie, unidade amostral, período, replicação e detectabilidade.</p><a class="br-source" href="${e(c.source)}" target="_blank" rel="noopener noreferrer">Conhecer a referência científica ↗</a>${c.sourceData?`<p><a class="br-source" href="${e(c.sourceData)}" target="_blank" rel="noopener noreferrer">Consultar a série histórica ↗</a></p>`:''}</section></div>
 ${c.id==='elton'||c.id==='pantanal'?comparisonBlock():''}<div class="br-bottom"><p><b>Transparência científica:</b> somente a série lebre–lince acima utiliza dados históricos transcritos. Todos os números, parâmetros, curvas e cenários brasileiros são construções didáticas e não foram ajustados, validados ou projetados para uma localidade.</p></div></section>`;
 target.innerHTML=markup;refresh()}
function refresh(){const c=caseById(BR.id),p=BR.params[c.id],dat=compute(c.id,p),ch=document.getElementById('br-chart');if(!ch)return;BR.current=dat;
 let series=dat.series.slice();const prior=BR.base[c.id];if(prior&&prior.series?.length&&dat.kind!=='bars'){const arr=prior.series[0].y;if(arr.length===dat.series[0].y.length)series.push({name:'Referência · '+prior.series[0].name,y:arr,color:styles.ref,dash:true})}
 const plotObj={...dat,series};ch.innerHTML=plot(plotObj,{cursor:BR.step});
 let currentStep=BR.step==null?0:clamp(BR.step,0,dat.x.length-1);const time=document.getElementById('br-time');if(time){time.max=Math.max(0,dat.x.length-1);time.value=currentStep}const stepOut=document.getElementById('br-step-text');if(stepOut)stepOut.textContent=`${dat.xLabel||'Tempo'}: ${f(dat.x[currentStep],0)}`;
 const metrics=document.getElementById('br-metrics');if(metrics)metrics.innerHTML=dat.metrics.map(([name,value,unit])=>`<div><strong>${f(value,2)}</strong><small>${e(name)} · ${e(unit)}</small></div>`).join('');
 const note=document.getElementById('br-note');if(note)note.textContent=dat.conclusion;const saved=document.getElementById('br-saved');if(saved)saved.textContent=prior?'Referência guardada: a curva cinza pontilhada representa a primeira variável de resposta do cenário guardado.':'Fixe uma curva de referência e altere uma variável para testar outra hipótese.';
 c.params.forEach(([key])=>{const out=document.getElementById('br-val-'+key);if(out)out.textContent=f(p[key],3)+' '+c.params.find(y=>y[0]===key)[2]})}
function stop(){if(BR.timer)clearInterval(BR.timer);BR.timer=null;BR.run=false}
function play(){stop();const dat=BR.current;if(!dat||dat.x.length<2)return;BR.run=true;BR.timer=setInterval(()=>{if(!BR.run){stop();return}BR.step=(BR.step==null?0:BR.step)+1;if(BR.step>=BR.current.x.length)BR.step=0;refresh()},300)}
const shocks={elton:{refuge:65},pantanal:{alt:0,refuge:0},cerrado:{fogo:2,sever:85},caatinga:{chuva:280,retencao:25},amazonia:{con:15,pesca:60},mata:{cob:20,con:10,agro:60},mangue:{sal:50,mare:20},cidade:{imper:90,verde:5}};
function clickHandler(ev){const el=ev.target.closest('button');if(!el||!el.closest('.br-wrap'))return;
 if(el.dataset.brCase){BR.id=el.dataset.brCase;BR.step=null;render();return}
 if(el.dataset.brReset){BR.params[BR.id]={...caseById(BR.id).values};BR.step=null;render();return}
 if(el.dataset.brPerturb){Object.assign(BR.params[BR.id],shocks[BR.id]);render();return}
 if(el.dataset.brBaseline){BR.base[BR.id]=JSON.parse(JSON.stringify(compute(BR.id,BR.params[BR.id])));refresh();return}
 if(el.dataset.brPlay){play();return}
 if(el.dataset.brPause){stop();return}
}
function inputHandler(ev){const el=ev.target;if(!el.closest('.br-wrap'))return;
 if(el.dataset.brParam){BR.params[BR.id][el.dataset.brParam]=+el.value;stop();refresh()}
 if(el.dataset.brTime){BR.step=+el.value;stop();refresh()}
}
document.addEventListener('click',clickHandler);document.addEventListener('input',inputHandler);
function mount(){const target=document.getElementById('brasil-lab-root');if(target){render();return}if(typeof NAV!=='undefined'&&typeof S!=='undefined'&&typeof goto==='function'){
 const index=NAV.findIndex(x=>x[0]==='labpop');NAV.splice(index+1,0,['brasilvivo','Brasil Vivo · Elton & biomas','🌿']);
 const oldRender=renderGlobal();function renderGlobal() {return window.render;}
 window.render=function(){if(S.view==='brasilvivo'){try{disposeMicro3D();disposeChem3D()}catch(ex){}renderNav();const holder=document.getElementById('view');if(holder)holder.innerHTML='<div id="brasil-lab-root"></div>';render();return}stop();oldRender()};
 const qp=new URLSearchParams(location.search);if(qp.has('brasil'))S.view='brasilvivo';
 window.render();
 }
}
window.BRASIL_VIVO={cases:CASES,compute,plot,refresh,render,mount,history:HIST};
mount();
})();
